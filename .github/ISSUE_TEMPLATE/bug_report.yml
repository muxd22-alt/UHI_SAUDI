name: 🐛 Bug report
description: Something in the simulator behaves incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For **security** issues please
        use the [private advisory channel](https://github.com/muxd22-alt/UHI_SAUDI/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/muxd22-alt/UHI_SAUDI/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: The PIF Balance card shows NaN after switching to Arabic...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact slider/preset/language state if relevant.
      placeholder: |
        1. Open /docs/
        2. Select the "Delayed Shift" preset
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulation engine / numbers
        - UI or layout
        - Charts
        - Language / RTL / currency
        - Data loader or API status
        - Data refresh script / workflow
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Chrome 130 / Windows 11, 1600x1000"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Scenario URL (if relevant)
      description: Copy the address bar — the part after `#` restores your exact slider state.
  - type: textarea
    id: logs
    attributes:
      label: Console output / screenshots
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/muxd22-alt/UHI_SAUDI/issues) for duplicates
          required: true
        - label: This still happens with the default "Vision 2030" preset
