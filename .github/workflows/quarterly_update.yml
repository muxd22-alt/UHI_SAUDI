name: Quarterly Macro Data Update Pipeline

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Latest Indicators from World Bank Free API
        run: python scripts/fetch_worldbank.py

      - name: Validate Data JSON Schema
        run: |
          python - <<'PY'
          import json, sys
          doc = json.load(open('docs/macro_data.json', encoding='utf-8'))
          for block in ('metadata', 'indicators', 'calibration'):
              if block not in doc:
                  sys.exit(f"missing block: {block}")
          if not doc['indicators']:
              sys.exit("indicators block is empty")
          print("OK:", len(doc['indicators']), "indicators,",
                "partial" if doc['metadata'].get('partial') else "complete")
          PY

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated quarterly World Bank macro refresh [skip ci]"
          file_pattern: 'docs/macro_data.json'
          branch: main
